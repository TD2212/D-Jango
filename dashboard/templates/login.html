<style>
        body {
            background-color: #f7f9fb;
            background-image: radial-gradient(at 0% 0%, rgba(33, 112, 228, 0.05) 0px, transparent 50%),
                              radial-gradient(at 100% 100%, rgba(33, 112, 228, 0.05) 0px, transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
        }

        .login-card {
            box-shadow: 0px 20px 25px -5px rgba(0, 0, 0, 0.1), 0px 8px 10px -6px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .input-focus-ring:focus {
            outline: none;
            border-color: #2170e4;
            box-shadow: 0 0 0 3px rgba(33, 112, 228, 0.2);
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .btn-primary-gradient {
            background: linear-gradient(180deg, #2170e4 0%, #1a59b7 100%);
        }
    </style>

<body class="bg-background text-on-background antialiased p-4">
<!-- Login Container -->
<main class="w-full max-w-[440px]">
<!-- Logo Section -->
<div class="flex flex-col items-center mb-8">
<div class="mb-4 p-3 bg-white rounded-xl shadow-sm border border-surface-container">
<img alt="Django Admin" class="w-12 h-12 object-contain" data-alt="A clean, professional corporate logo for an enterprise SaaS dashboard. The logo features a minimalist geometric emblem in primary blue and deep navy, conveying trust and technological sophistication. It is presented in a high-key, modern aesthetic against a soft white background, perfectly aligned for an authoritative yet accessible admin panel interface." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBpZihFAozV9DhhAv2v5toQkFt3TiqMsdrnu9s_025HvLvKkNtVycr497xy4IllxIcgjESlD9U_zGdef-fipgrOZwF_UQ8cVUqlopqOLq5VG-isGD2kOqaHGISoHombCfQSCXzeUhIqW171Aib5ifQnRQ5S703Av3dZYfVb51i6Raob7cwqpQSVZrw7yTerLKKeuTkoPn1gyDA65XcNDx7vUx4JZHlrZwZ7mndVGNdoX85BUAS-PLpad9fO1kcc7pcnfapqURZbvMc"/>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">Django Admin</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1">Enterprise Suite Management</p>
</div>
<!-- Login Card -->
<div class="login-card bg-surface-container-lowest rounded-xl border border-surface-container overflow-hidden">
<div class="p-8">
<form class="flex flex-col gap-5" id="loginForm" onsubmit="handleLogin(event)">
<!-- Email Field -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="email">Email Address</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px] transition-colors group-focus-within:text-secondary">mail</span>
<input class="w-full pl-10 pr-4 py-3 rounded-xl border border-outline-variant bg-white text-body-md font-body-md input-focus-ring transition-all placeholder:text-outline/50" id="email" name="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-sm text-label-sm text-secondary hover:underline transition-all" href="#">Forgot password?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px] transition-colors group-focus-within:text-secondary">lock</span>
<input class="w-full pl-10 pr-12 py-3 rounded-xl border border-outline-variant bg-white text-body-md font-body-md input-focus-ring transition-all placeholder:text-outline/50" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-[20px]" id="passwordToggleIcon">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center gap-3 py-1">
<input class="w-5 h-5 rounded border-outline-variant text-secondary-container focus:ring-secondary transition-all cursor-pointer" id="remember" name="remember" type="checkbox"/>
<label class="font-body-sm text-body-sm text-on-surface-variant cursor-pointer select-none" for="remember">Remember me for 30 days</label>
</div>
<!-- Submit Button -->
<button class="btn-primary-gradient w-full py-4 text-white font-label-md text-label-md rounded-xl shadow-lg hover:brightness-110 active:scale-95 transition-all duration-200 mt-2 flex items-center justify-center gap-2" type="submit">
                        Sign In to Dashboard
                        <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Help & Social -->
<div class="mt-8 pt-6 border-t border-surface-container text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant mb-4">Or sign in with SSO</p>
<div class="flex justify-center gap-4">
<button class="flex items-center justify-center w-full py-2.5 px-4 rounded-xl border border-outline-variant bg-white hover:bg-surface-container-low transition-all active:scale-98">
<span class="material-symbols-outlined mr-2">google</span>
<span class="font-label-sm text-label-sm">Google</span>
</button>
<button class="flex items-center justify-center w-full py-2.5 px-4 rounded-xl border border-outline-variant bg-white hover:bg-surface-container-low transition-all active:scale-98">
<span class="material-symbols-outlined mr-2">hub</span>
<span class="font-label-sm text-label-sm">Azure</span>
</button>
</div>
</div>
</div>
</div>
<!-- Footer Credits (Matching Shared Components Footers in Spirit) -->
<footer class="mt-8 text-center px-gutter flex flex-col gap-2">
<p class="font-label-sm text-label-sm text-outline opacity-70">
                © 2024 Django Admin Dashboard. All rights reserved.
            </p>
<div class="flex justify-center gap-4">
<a class="font-label-sm text-label-sm text-outline hover:text-secondary transition-colors" href="#">Privacy Policy</a>
<span class="text-outline/30">•</span>
<a class="font-label-sm text-label-sm text-outline hover:text-secondary transition-colors" href="#">Support Center</a>
</div>
</footer>
</main>
<script>
        /**
         * Toggle Password Visibility
         */
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const icon = document.getElementById('passwordToggleIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                icon.textContent = 'visibility';
            }
        }

        /**
         * Form Submission Simulation
         */
        function handleLogin(event) {
            event.preventDefault();
            const btn = event.target.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            
            // Visual feedback
            btn.disabled = true;
            btn.innerHTML = `
                <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Authenticating...
            `;

            // Mocking a redirect
            setTimeout(() => {
                console.log("Redirecting to dashboard...");
                // alert("Authentication successful!"); 
                // Normally: window.location.href = '/dashboard';
                btn.innerHTML = originalContent;
                btn.disabled = false;
            }, 1500);
        }

        // Initialize micro-interactions
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.closest('.login-card').style.transform = 'translateY(-2px)';
            });
            input.addEventListener('blur', () => {
                input.parentElement.closest('.login-card').style.transform = 'translateY(0)';
            });
        });
    </script>
</body></html>
