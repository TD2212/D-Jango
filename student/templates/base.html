<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Student Management System{% endblock %}</title>

    <!-- Bootstrap 5 CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background-color: #f5f7fa;
        }

        .sidebar {
            min-height: 100vh;
            width: 250px;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #212529;
        }

        .sidebar .logo {
            padding: 25px 15px;
            text-align: center;
            color: white;
            font-size: 22px;
            font-weight: bold;
            border-bottom: 1px solid #495057;
        }

        .sidebar .nav-link {
            color: #adb5bd;
            padding: 14px 25px;
            font-size: 16px;
        }

        .sidebar .nav-link:hover {
            background-color: #343a40;
            color: white;
        }

        .main-content {
            margin-left: 250px;
            padding: 30px;
        }

        .page-card {
            background-color: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }
    </style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

    <div class="logo">
        🎓 Student Portal
    </div>

    <nav class="nav flex-column mt-3">

        <a class="nav-link" href="{% url 'home' %}">
            🏠 Home
        </a>

        <a class="nav-link" href="{% url 'about' %}">
            ℹ️ About
        </a>

        <a class="nav-link" href="{% url 'course' %}">
            📚 Course
        </a>

       <a class="nav-link" href="{% url 'student_list' %}">
    👨‍🎓 Student
        </a>

        <a class="nav-link" href="{% url 'result' %}">
            📊 Result
        </a>

        <a class="nav-link" href="{% url 'contact' %}">
            📞 Contact
        </a>

    </nav>

</div>


<!-- MAIN CONTENT -->
<div class="main-content">

    {% block content %}
    {% endblock %}

</div>


<!-- Bootstrap 5 JS -->
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
