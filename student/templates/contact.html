{% extends "base.html" %}

{% block title %}Contact{% endblock %}

{% block content %}

<div class="page-card">

    <h1 class="text-primary mb-4">
        Contact Us
    </h1>

    <div class="row">

        <div class="col-md-6">

            <h5>📍 Address</h5>
            <p>Ahmedabad, Gujarat, India</p>

            <h5>📞 Phone</h5>
            <p>+91 98765 43210</p>

            <h5>📧 Email</h5>
            <p>info@studentportal.com</p>

        </div>

        <div class="col-md-6">

            <form>

                <div class="mb-3">
                    <label class="form-label">Name</label>
                    <input
                        type="text"
                        class="form-control"
                        placeholder="Enter your name"
                    >
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input
                        type="email"
                        class="form-control"
                        placeholder="Enter your email"
                    >
                </div>

                <div class="mb-3">
                    <label class="form-label">Message</label>
                    <textarea
                        class="form-control"
                        rows="4"
                        placeholder="Enter your message">
                    </textarea>
                </div>

                <button class="btn btn-primary">
                    Send Message
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
