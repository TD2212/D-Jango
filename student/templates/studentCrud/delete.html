{% extends "base.html" %}

{% block title %}Delete Student{% endblock %}

{% block content %}

<div class="page-card">

    <div class="text-center py-4">

        <div class="mb-3">
            <span style="font-size: 60px;">
                ⚠️
            </span>
        </div>

        <h1 class="text-danger">
            Delete Student
        </h1>

        <p class="lead mt-3">
            Are you sure you want to delete this student?
        </p>

        <div class="card bg-light mx-auto mt-4"
             style="max-width: 500px;">

            <div class="card-body">

                <h5>
                    {{ student.name }}
                </h5>

                <p class="text-muted mb-1">
                    {{ student.email }}
                </p>

                <p class="text-muted mb-0">
                    {{ student.course }}
                </p>

            </div>

        </div>


        <form method="POST" class="mt-4">

            {% csrf_token %}

            <button type="submit"
                    class="btn btn-danger">
                Yes, Delete
            </button>

            <a href="{% url 'student_list' %}"
               class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>

</div>

{% endblock %}
